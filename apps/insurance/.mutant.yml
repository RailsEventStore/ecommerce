includes:
  - test
requires:
  - ./config/environment
integration: minitest
usage: opensource
coverage_criteria:
  timeout: true
  process_abort: true
matcher:
  subjects:
    - Processes*
    - Applications*
    - PolicyList*
  ignore:
    - Processes::Configuration#call
    - Applications::Configuration#call
    - Applications::Application*
    - PolicyList::Configuration#call
    - PolicyList::Policy*
