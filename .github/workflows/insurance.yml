name: insurance
on:
  push:
  pull_request:
    types: [opened, reopened]
jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: insurance_test
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-3.4.9
          bundler-cache: true
          working-directory: apps/insurance
      - name: Run tests
        run: make -C apps/insurance test
        env:
          DATABASE_URL: "postgres://postgres:secret@localhost:5432/insurance_test"
          RAILS_ENV: test
  mutate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: insurance_test
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-3.4.9
          bundler-cache: true
          working-directory: apps/insurance
      - name: Run mutation tests
        run: make -C apps/insurance mutate
        env:
          DATABASE_URL: "postgres://postgres:secret@localhost:5432/insurance_test"
          RAILS_ENV: test
